name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.0; must match the selected ref'
        required: true
        type: string
      windows_installer_only:
        description: 'Replace only the Windows installer in an existing draft; runtime sources must match its tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  RUST_TOOLCHAIN: '1.97.1'

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      revision: ${{ steps.revision.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag matches Cargo version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python .github/scripts/release.py version --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Record immutable source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select native builds and verify draft repack source
        id: matrix
        env:
          WINDOWS_ONLY: ${{ inputs.windows_installer_only || false }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          options=()
          if [ "$WINDOWS_ONLY" = true ]; then
            git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
            git diff --exit-code "refs/tags/$RELEASE_TAG^{commit}" HEAD -- Cargo.toml Cargo.lock apps crates assets licenses
            options+=(--windows-only)
          fi
          python .github/scripts/release.py matrix "${options[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Test release packaging
        run: python -m unittest discover -s .github/scripts -v

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libssl-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev
      - name: Configure macOS SDK
        if: runner.os == 'macOS'
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          # macOS TMPDIR can contain /var -> /private/var. Security tests need
          # physical fixture roots; they test symbolic links explicitly.
          echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Use static Windows C runtime
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Configure Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6.7+ is required' }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}'
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test application logic
        run: cargo test --locked --workspace --no-default-features --target '${{ matrix.target }}'
      - name: Check full native desktop
        run: cargo clippy --locked --workspace --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Build and package release
        run: python .github/scripts/release.py build --target '${{ matrix.target }}'
      - name: Test Windows install, reinstall and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./.github/scripts/test_windows_installer.ps1 -Installer "dist/Purge-$env:RELEASE_VERSION-windows-x64-setup.exe" -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      WINDOWS_ONLY: ${{ inputs.windows_installer_only || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore other bundles from the existing draft
        if: inputs.windows_installer_only
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "Purge-$RELEASE_VERSION-linux-*" --pattern "Purge-$RELEASE_VERSION-macos-*"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifacts and checksums
        run: |
          python .github/scripts/release.py checksums
          cd dist
          sha256sum --check SHA256SUMS
      - name: Confirm or create version tag
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$WINDOWS_ONLY" = true ]; then
              git diff --exit-code "refs/tags/$RELEASE_TAG^{commit}" HEAD -- Cargo.toml Cargo.lock apps crates assets licenses
            else
              test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_REVISION"
            fi
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_REVISION" > /dev/null
          fi
      - name: Create or resume draft and upload bundles
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt; then
            test "$(cat draft-state.txt)" = true || { echo 'Published releases are immutable in this workflow.'; exit 1; }
          else
            prerelease=()
            if [ "$RELEASE_PRERELEASE" = true ]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Purge $RELEASE_TAG" --generate-notes \
              --notes-file .github/release-notes.md "${prerelease[@]}"
          fi
          if [ "$WINDOWS_ONLY" = true ]; then
            gh release upload "$RELEASE_TAG" dist/*.exe dist/SHA256SUMS --clobber
            gh release view "$RELEASE_TAG" --json body --jq .body > draft-notes.md
            python .github/scripts/release.py windows-notes draft-notes.md
            gh release edit "$RELEASE_TAG" --notes-file draft-notes.md
          else
            gh release upload "$RELEASE_TAG" dist/*.exe dist/*.zip dist/*.tar.gz dist/SHA256SUMS --clobber
          fi
          legacy="Purge-$RELEASE_VERSION-windows-x64.zip"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$legacy"; then
            gh release delete-asset "$RELEASE_TAG" "$legacy" --yes
          fi
