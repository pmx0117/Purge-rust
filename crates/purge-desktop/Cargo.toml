[package]
name = "purge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A local-first Windows disk cleaner, built with Rust and GPUI"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:smol", "dep:unicode-segmentation", "dep:raw-window-handle"]

[dependencies]
purge-core.workspace = true
purge-engine.workspace = true
anyhow.workspace = true
chrono.workspace = true
gpui = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[build-dependencies]
embed-resource.workspace = true

[[bin]]
name = "purge"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
windows = {workspace=true,features=["Win32_Graphics_Dwm","Win32_Foundation"]}

[dev-dependencies]
tempfile.workspace=true
serde_json.workspace=true
